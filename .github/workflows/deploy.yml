name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enviar arquivos para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 42501
          source: "."
          target: "/home/${{ secrets.VPS_USER }}/apps/matiaai"

      - name: Atualizar container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 42501
          script: |
            cd /home/${{ secrets.VPS_USER }}/apps/matiaai

            docker build -t matia-frontend-img .

            docker stop matia-app || true
            docker rm matia-app || true

            docker run -d \
              --name matia-app \
              --restart always \
              -p 80:80 \
              matia-frontend-img
              
            docker image prune -f